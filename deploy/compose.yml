services:
  panel:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      BIND_HOST: 0.0.0.0
      DB_PATH: /data/cihaz-takip.sqlite
      PC_ONLY: '1'
      TRUST_PROXY: '1'
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - ./data:/data
